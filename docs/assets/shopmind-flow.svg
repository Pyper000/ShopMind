<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1460" viewBox="0 0 1780 1460">
<style>
  .h { font: 700 26px 'Microsoft YaHei','PingFang SC',sans-serif; fill: #e8edf7; }
  .n { font: 400 14px 'Microsoft YaHei',sans-serif; fill: #93a0b8; }
  .t { font: 700 17px 'Microsoft YaHei',sans-serif; fill: #f1f5ff; }
  .s { font: 400 13.5px 'Microsoft YaHei',sans-serif; fill: #b6c1d4; }
</style>
<rect width="1780" height="1460" fill="#0b0f16"/>
<text x="48" y="58" class="h">ShopMind：从一句需求到商品方案（建议目标流程）</text><text x="48" y="88" class="n">紫色=MainAgent 理解与状态 · 青色=SearchAgent 检索 · 琥珀=目录缺位如实告知 · 灰色=确定性计算。当前代码只实现左列前两段与右侧灰色段，其余为待确认目标。</text><rect x="48" y="130" width="250" height="130" rx="12" fill="#1f2a44" stroke="#7c9cff" stroke-width="1.6"/><text x="64" y="158" class="t">用户输入</text><text x="64" y="184" class="s">场景表达：帮我准备开学</text><text x="64" y="208" class="s">明确品类：还想买创可贴</text><text x="64" y="232" class="s">约束微调 / 场景变更</text><polyline points="298,186 352,186" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -8,-5 L 0,0 L -8,5" transform="translate(352,186)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="352" y="130" width="290" height="176" rx="12" fill="#2a2140" stroke="#a78bfa" stroke-width="1.6"/><text x="368" y="158" class="t">MainAgent 先判意图</text><text x="368" y="184" class="s">① 整场景需求</text><text x="368" y="208" class="s">② 明确单品/品类</text><text x="368" y="232" class="s">③ 预算/偏好微调</text><text x="368" y="256" class="s">④ 场景/人数/用途变更</text><text x="368" y="280" class="s">⑤ 信息不足</text><rect x="352" y="340" width="290" height="104" rx="12" fill="#2a2140" stroke="#a78bfa" stroke-width="1.6"/><text x="368" y="368" class="t">① 场景规划</text><text x="368" y="394" class="s">模板优先（如海边）；未覆盖时</text><text x="368" y="418" class="s">只问一个会改变清单的问题</text><polyline points="642,392 700,392" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -8,-5 L 0,0 L -8,5" transform="translate(700,392)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="352" y="520" width="290" height="104" rx="12" fill="#2a2140" stroke="#a78bfa" stroke-width="1.6"/><text x="368" y="548" class="t">② 明确品类直达</text><text x="368" y="574" class="s">别名/品类词命中：新增单槽位</text><text x="368" y="598" class="s">已有方案：只改该槽位，不重出清单</text><polyline points="642,572 700,572" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -8,-5 L 0,0 L -8,5" transform="translate(700,572)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="352" y="700" width="290" height="104" rx="12" fill="#2a2140" stroke="#a78bfa" stroke-width="1.6"/><text x="368" y="728" class="t">③ 约束微调</text><text x="368" y="754" class="s">预算/偏好变化：保留方案与候选</text><text x="368" y="778" class="s">只对该槽位过滤、重排</text><polyline points="642,752 700,752" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -8,-5 L 0,0 L -8,5" transform="translate(700,752)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="352" y="880" width="290" height="104" rx="12" fill="#2a2140" stroke="#a78bfa" stroke-width="1.6"/><text x="368" y="908" class="t">④ 实质变更</text><text x="368" y="934" class="s">场景/人数/核心用途变化才重规划</text><text x="368" y="958" class="s">按影响范围：局部补召回 / 整场景召回</text><polyline points="642,932 700,932" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -8,-5 L 0,0 L -8,5" transform="translate(700,932)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="700" y="340" width="250" height="104" rx="12" fill="#1f2a44" stroke="#7c9cff" stroke-width="1.6"/><text x="716" y="368" class="t">具体必备 / 按需清单</text><text x="716" y="394" class="s">逐项可核对，不合并大类</text><text x="716" y="418" class="s">按需项不自动进入待购</text><polyline points="950,392 1000,392 1000,330" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -5,8 L 0,0 L 5,8" transform="translate(1000,330)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="700" y="520" width="250" height="104" rx="12" fill="#2a2140" stroke="#a78bfa" stroke-width="1.6"/><text x="716" y="548" class="t">单槽位方案更新</text><text x="716" y="574" class="s">不重开整份场景清单</text><text x="716" y="598" class="s">保留已确认状态</text><polyline points="950,572 1000,572 1000,470" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -5,8 L 0,0 L 5,8" transform="translate(1000,470)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="700" y="700" width="250" height="104" rx="12" fill="#123033" stroke="#2dd4bf" stroke-width="1.6"/><text x="716" y="728" class="t">复用原候选重排</text><text x="716" y="754" class="s">候选不足才局部补召回</text><polyline points="950,752 1000,752 1000,610" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -5,8 L 0,0 L 5,8" transform="translate(1000,610)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="700" y="880" width="250" height="104" rx="12" fill="#123033" stroke="#2dd4bf" stroke-width="1.6"/><text x="716" y="908" class="t">受影响范围重召回</text><text x="716" y="934" class="s">不无故抹掉用户确认</text><polyline points="950,932 1000,932 1000,750" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -5,8 L 0,0 L 5,8" transform="translate(1000,750)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="352" y="1060" width="290" height="80" rx="12" fill="#2a2140" stroke="#a78bfa" stroke-width="1.6"/><text x="368" y="1088" class="t">⑤ 只问一个关键问题</text><text x="368" y="1114" class="s">问题必须会改变品类/数量/安全适配</text><polyline points="352,1100 322,1100 322,156 352,156" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M -8,-5 L 0,0 L -8,5" transform="translate(352,156)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="1000" y="250" width="250" height="700" rx="16" fill="#123033" stroke="#2dd4bf" stroke-width="1.8"/><text x="1020" y="290" class="t">SearchAgent（子代理）</text><text x="1020" y="322" class="s">职责：召回 / 硬约束 / 排序</text><text x="1020" y="348" class="s">不改写购物清单事实</text><text x="1020" y="386" class="s">• 一批独立槽位并行派发</text><text x="1020" y="412" class="s">• 只处理本轮受影响槽位</text><text x="1020" y="438" class="s">• 槽位→商品必须同品类</text><text x="1020" y="476" class="s">检索工具：Qdrant 向量召回*</text><text x="1020" y="502" class="s">→ Reranker 精排；异常时降级</text><text x="1020" y="528" class="s">→ 关键词 2-gram（如实标注）</text><text x="1020" y="566" class="s">硬约束：价格上限 / 目的国</text><text x="1020" y="592" class="s">在工具内完成，不让模型猜</text><text x="1020" y="630" class="s">返回：每槽位 ≤3 个候选</text><text x="1020" y="656" class="s">+ 匹配依据 / 未知 / 检索路径</text><text x="1020" y="694" class="s">没检索到就返回空，并说明</text><text x="1020" y="720" class="s">“模拟目录未收录 / 待入驻”</text><text x="1020" y="758" class="s">禁止拿相邻品类凑数</text><text x="1020" y="796" class="s">性能目标：首屏先给清单/卡片，</text><text x="1020" y="822" class="s">不让用户干等整轮结束</text><polyline points="1250,470 1270,470 1270,186 1300,186" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -8,-5 L 0,0 L -8,5" transform="translate(1300,186)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="1300" y="130" width="430" height="104" rx="12" fill="#1c2433" stroke="#94a3b8" stroke-width="1.6"/><text x="1316" y="158" class="t">ProductSearchTool</text><text x="1316" y="184" class="s">Qdrant 召回 → Reranker；故障降级关键词</text><text x="1316" y="208" class="s">candidate_ids 可复用，避免重复召回</text><text x="1316" y="232" class="s">严格同品类校验 + 价格/配送硬约束</text><polyline points="1515.0,234 1515.0,280" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -5,-8 L 0,0 L 5,-8" transform="translate(1515.0,280)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="1300" y="280" width="430" height="70" rx="12" fill="#14263d" stroke="#38bdf8" stroke-width="1.6"/><text x="1316" y="308" class="t">候选是否存在？</text><text x="1316" y="334" class="s">有：按槽位展示，每槽位最多 3 个候选卡</text><polyline points="1390,350 1390,396" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -5,-8 L 0,0 L 5,-8" transform="translate(1390,396)" fill="none" stroke="#64748b" stroke-width="1.6"/><polyline points="1630,350 1630,396" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -5,-8 L 0,0 L 5,-8" transform="translate(1630,396)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="1300" y="396" width="200" height="104" rx="12" fill="#14263d" stroke="#38bdf8" stroke-width="1.6"/><text x="1316" y="424" class="t">有同品类候选</text><text x="1316" y="450" class="s">卡片含价格、依据、</text><text x="1316" y="474" class="s">取舍与未知</text><rect x="1530" y="396" width="200" height="104" rx="12" fill="#3a2b14" stroke="#f59e0b" stroke-width="1.6"/><text x="1546" y="424" class="t">没有 → 缺口</text><text x="1546" y="450" class="s">显示模拟目录未覆盖 /</text><text x="1546" y="474" class="s">待入驻；不凑无关类目</text><polyline points="1400,500 1400,546 1515,546" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -8,-5 L 0,0 L -8,5" transform="translate(1515,546)" fill="none" stroke="#64748b" stroke-width="1.6"/><polyline points="1630,500 1630,546 1515,546" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M 8,-5 L 0,0 L 8,5" transform="translate(1515,546)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="1300" y="546" width="430" height="104" rx="12" fill="#1f2a44" stroke="#7c9cff" stroke-width="1.6"/><text x="1316" y="574" class="t">用户选择</text><text x="1316" y="600" class="s">每个待购槽位选 0 或 1 件；按需项需主动纳入</text><text x="1316" y="624" class="s">“加入比较”只比较，不计入采购总价</text><polyline points="1515.0,650 1515.0,696" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -5,-8 L 0,0 L 5,-8" transform="translate(1515.0,696)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="1300" y="696" width="430" height="118" rx="12" fill="#1c2433" stroke="#94a3b8" stroke-width="1.6"/><text x="1316" y="724" class="t">应用层计算商品价合计（确定性）</text><text x="1316" y="750" class="s">Σ 选中 SKU 单价 × 数量；显示预算上限差额</text><text x="1316" y="774" class="s">不需要 LLM；TradeAgent 不是报价器</text><text x="1316" y="798" class="s">未确认配送地时不声称到手价</text><polyline points="1515.0,814 1515.0,860" fill="none" stroke="#64748b" stroke-width="1.6"/><path d="M -5,-8 L 0,0 L 5,-8" transform="translate(1515.0,860)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="1300" y="860" width="430" height="104" rx="12" fill="#14263d" stroke="#38bdf8" stroke-width="1.6"/><text x="1316" y="888" class="t">用户确认这套采购方案（MVP 终点）</text><text x="1316" y="914" class="s">当前只记录演示选择：不加购物车、不创建订单</text><text x="1316" y="938" class="s">如需下单：用户明确要求 + 二次确认商品/数量/地址</text><polyline points="1515.0,964 1515.0,1010" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M -5,-8 L 0,0 L 5,-8" transform="translate(1515.0,1010)" fill="none" stroke="#64748b" stroke-width="1.6"/><rect x="1300" y="1010" width="430" height="118" rx="12" fill="#2a2140" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="7 5"/><text x="1316" y="1038" class="t">TradeAgent（未来，本 MVP 关闭）</text><text x="1316" y="1064" class="s">仅在用户明确“下单”后校验库存并创建订单</text><text x="1316" y="1088" class="s">create_order_tool 返回订单状态；不含支付/物流</text><text x="1316" y="1112" class="s">金额只能取工具/目录事实，禁止自行计算</text><text x="48" y="1190" class="n">当前代码现状：清单控件提交 → 直接提交状态 → 只搜明确待购槽位；但聊天框里“我还想买创可贴”会进入完整方案更新（首工具强制 update_shopping_plan_tool），因此会重出清单。</text><text x="48" y="1220" class="n">本次改造只补“路由器 + 单槽位直达 + 受控召回范围 + 商品选择/合计”，保留 MainAgent 管状态、SearchAgent 管召回排序、TradeAgent 休眠的三层边界。</text><text x="48" y="1250" class="n">清单 UI 的按钮事实仍优先于自然语言推断；任何召回结果都不能反向改写“已有 / 不买 / 待确认”。</text><text x="48" y="1280" class="n">* 未配置 embedding/Qdrant 或调用异常时自动降级关键词召回，并在 trace 中如实标注召回策略。</text>
</svg>